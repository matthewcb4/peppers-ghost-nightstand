<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Pepper's Ghost smart nightstand display with ambient video and floating clock HUD.">
  <title>Ghost Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ================================================================
       RESET & GLOBAL
       ================================================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hide scrollbars everywhere */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* ================================================================
       VIDEO CANVAS (Full-Bleed)
       ================================================================ */
    #video-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000000;
    }

    #video-canvas iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110vw;
      height: 110vh;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
    }

    /* ================================================================
       HUD OVERLAY — Pepper's Ghost mirrored
       ================================================================ */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      transform: scaleX(-1);        /* Mirror for 45° glass reflection */
    }

    /* ================================================================
       CLOCK / DATE — Floating with burn-in pixel shift
       ================================================================ */
    #clock-container {
      position: absolute;
      bottom: 6vh;
      left: 5vw;
      animation: pixel-shift 240s ease-in-out infinite alternate;
      transition: color 1.2s ease, text-shadow 1.2s ease;
    }

    #clock-time {
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 200;
      letter-spacing: 0.04em;
      line-height: 1;
      color: rgba(255, 255, 255, 0.88);
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.10),
        0 0 60px rgba(255, 255, 255, 0.04);
    }

    #clock-seconds {
      font-size: 0.35em;
      font-weight: 300;
      opacity: 0.45;
      vertical-align: super;
      margin-left: 0.15em;
    }

    #clock-ampm {
      font-size: 0.28em;
      font-weight: 400;
      letter-spacing: 0.12em;
      opacity: 0.55;
      vertical-align: super;
      margin-left: 0.2em;
    }

    #clock-date {
      font-size: clamp(0.7rem, 1.8vw, 1.1rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
      margin-top: 0.5em;
    }

    /* ================================================================
       NIGHT MODE — Amber/Red tint (10 PM → 6 AM)
       ================================================================ */
    .night-mode #clock-time {
      color: rgba(255, 59, 48, 0.72);
      text-shadow:
        0 0 15px rgba(255, 59, 48, 0.08),
        0 0 50px rgba(255, 59, 48, 0.03);
    }

    .night-mode #clock-date {
      color: rgba(255, 59, 48, 0.30);
    }

    .night-mode #status-bar .indicator {
      color: rgba(255, 59, 48, 0.30);
    }

    .night-mode #status-bar .indicator.active {
      color: rgba(255, 59, 48, 0.55);
    }

    /* ================================================================
       STATUS INDICATORS (top-right)
       ================================================================ */
    #status-bar {
      position: absolute;
      top: 3vh;
      right: 4vw;
      display: flex;
      gap: 1.6em;
      font-size: clamp(0.55rem, 1.2vw, 0.75rem);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    #status-bar .indicator {
      color: rgba(255, 255, 255, 0.18);
      transition: color 1.2s ease;
    }

    #status-bar .indicator.active {
      color: rgba(255, 255, 255, 0.50);
    }

    /* ================================================================
       PIXEL-SHIFT KEYFRAMES (burn-in protection)
       ================================================================ */
    @keyframes pixel-shift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(6px, -3px); }
      50%  { transform: translate(-4px, 5px); }
      75%  { transform: translate(3px, 2px); }
      100% { transform: translate(-5px, -4px); }
    }

    /* ================================================================
       TAP-TO-START OVERLAY
       ================================================================ */
    #tap-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #tap-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #tap-overlay .tap-ring {
      width: 100px;
      height: 100px;
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ring-pulse 2.8s ease-in-out infinite;
      margin-bottom: 2rem;
    }

    #tap-overlay .tap-icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 14px 0 14px 24px;
      border-color: transparent transparent transparent rgba(255, 255, 255, 0.50);
      margin-left: 4px;
    }

    #tap-overlay .tap-label {
      font-size: clamp(0.65rem, 1.4vw, 0.85rem);
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
    }

    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%      { transform: scale(1.08); opacity: 1; }
    }

    /* ================================================================
       SETTINGS PANEL (hidden by default, revealed on triple-tap)
       ================================================================ */
    #settings-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1.5rem 2rem 2rem;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      /* UN-mirror so controls read normally */
      transform-origin: center center;
    }

    #settings-panel.open {
      transform: translateY(0) scaleX(-1); /* scaleX(-1) counteracts the HUD mirror */
    }

    #settings-panel h3 {
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 1rem;
    }

    #settings-panel .field {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    #settings-panel label {
      font-size: 0.75rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.55);
      min-width: 70px;
    }

    #settings-panel input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.75);
      outline: none;
      transition: border-color 0.2s;
    }

    #settings-panel input[type="text"]:focus {
      border-color: rgba(255, 255, 255, 0.20);
    }

    #settings-panel .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 6px;
      padding: 0.45rem 1rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #settings-panel .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.80);
    }
  </style>
</head>
<body>

  <!-- ============================================================
       VIDEO CANVAS
       ============================================================ -->
  <div id="video-canvas">
    <div id="yt-player"></div>
  </div>

  <!-- ============================================================
       HUD OVERLAY (mirrored for Pepper's Ghost)
       ============================================================ -->
  <div id="hud">
    <!-- Status Indicators -->
    <div id="status-bar">
      <span id="ind-wake" class="indicator" title="Wake Lock">WAKE</span>
      <span id="ind-loop" class="indicator" title="Loop Active">LOOP</span>
      <span id="ind-night" class="indicator" title="Night Mode">NIGHT</span>
    </div>

    <!-- Clock -->
    <div id="clock-container">
      <div id="clock-time">
        <span id="clock-hm">12:00</span><span id="clock-seconds">00</span><span id="clock-ampm">AM</span>
      </div>
      <div id="clock-date">Thursday, January 1</div>
    </div>

    <!-- Settings (inside HUD so it's part of the mirrored layer) -->
    <div id="settings-panel">
      <h3>Playlist</h3>
      <div class="field">
        <label>Video IDs</label>
        <input type="text" id="input-playlist" placeholder="dQw4w9WgXcQ, M7lc1UVf-VE" spellcheck="false" autocomplete="off">
      </div>
      <div class="field" style="justify-content: flex-end;">
        <button class="btn" id="btn-apply">Apply</button>
        <button class="btn" id="btn-close-settings">Close</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       TAP-TO-START OVERLAY
       ============================================================ -->
  <div id="tap-overlay">
    <div class="tap-ring">
      <div class="tap-icon"></div>
    </div>
    <span class="tap-label">Tap to Start</span>
  </div>

  <!-- ============================================================
       YOUTUBE IFRAME API
       ============================================================ -->
  <script>
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  </script>

  <script>
    (() => {
      'use strict';

      /* ==============================================================
         CONFIG
         ============================================================== */
      const DEFAULT_PLAYLIST = ['C8A_VNx81Ao'];
      const NIGHT_START = 22; // 10 PM
      const NIGHT_END   = 6;  // 6 AM
      const CLOCK_TICK  = 1000;

      /* ==============================================================
         STATE
         ============================================================== */
      let player       = null;
      let wakeLock     = null;
      let playlist     = loadPlaylist();
      let currentIndex = 0;
      let isStarted    = false;

      /* ==============================================================
         DOM REFS
         ============================================================== */
      const $overlay     = document.getElementById('tap-overlay');
      const $hud         = document.getElementById('hud');
      const $clockHM     = document.getElementById('clock-hm');
      const $clockSec    = document.getElementById('clock-seconds');
      const $clockAMPM   = document.getElementById('clock-ampm');
      const $clockDate   = document.getElementById('clock-date');
      const $indWake     = document.getElementById('ind-wake');
      const $indLoop     = document.getElementById('ind-loop');
      const $indNight    = document.getElementById('ind-night');
      const $settings    = document.getElementById('settings-panel');
      const $inputPL     = document.getElementById('input-playlist');
      const $btnApply    = document.getElementById('btn-apply');
      const $btnClose    = document.getElementById('btn-close-settings');

      /* ==============================================================
         PLAYLIST PERSISTENCE (localStorage)
         ============================================================== */
      function loadPlaylist() {
        try {
          const stored = localStorage.getItem('ghost_playlist');
          if (stored) {
            const arr = JSON.parse(stored);
            if (Array.isArray(arr) && arr.length) return arr;
          }
        } catch (_) { /* ignore */ }
        return [...DEFAULT_PLAYLIST];
      }

      function savePlaylist(ids) {
        playlist = ids;
        localStorage.setItem('ghost_playlist', JSON.stringify(ids));
      }

      /* ==============================================================
         YOUTUBE PLAYER
         ============================================================== */
      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('yt-player', {
          width: '100%',
          height: '100%',
          videoId: playlist[0],
          playerVars: {
            autoplay: 0,
            controls: 0,
            disablekb: 1,
            enablejsapi: 1,
            fs: 0,
            iv_load_policy: 3,
            loop: 0,               // We handle looping manually for playlists
            modestbranding: 1,
            playsinline: 1,
            rel: 0,
            showinfo: 0,
            mute: 1,
          },
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
            onError: onPlayerError,
          },
        });
      };

      function onPlayerReady() {
        player.mute();              // Ensure muted for autoplay policies
      }

      function onPlayerStateChange(e) {
        if (e.data === YT.PlayerState.ENDED) {
          // Advance to next video, loop back to start
          currentIndex = (currentIndex + 1) % playlist.length;
          player.loadVideoById({
            videoId: playlist[currentIndex],
            startSeconds: 0,
          });
          $indLoop.classList.add('active');
        }
        if (e.data === YT.PlayerState.PLAYING) {
          $indLoop.classList.add('active');
        }
      }

      function onPlayerError() {
        // Skip errored video after a short delay
        setTimeout(() => {
          currentIndex = (currentIndex + 1) % playlist.length;
          player.loadVideoById({ videoId: playlist[currentIndex], startSeconds: 0 });
        }, 3000);
      }

      /* ==============================================================
         TAP-TO-START
         ============================================================== */
      $overlay.addEventListener('click', handleStart, { once: true });
      $overlay.addEventListener('touchend', handleStart, { once: true });

      function handleStart(e) {
        e.preventDefault();
        if (isStarted) return;
        isStarted = true;

        $overlay.classList.add('hidden');
        setTimeout(() => { $overlay.style.display = 'none'; }, 700);

        // Start playback
        if (player && player.playVideo) {
          player.playVideo();
        }

        // Acquire wake lock
        acquireWakeLock();
      }

      /* ==============================================================
         SCREEN WAKE LOCK
         ============================================================== */
      async function acquireWakeLock() {
        if (!('wakeLock' in navigator)) {
          console.warn('Wake Lock API not supported');
          return;
        }
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          $indWake.classList.add('active');
          wakeLock.addEventListener('release', () => {
            $indWake.classList.remove('active');
            wakeLock = null;
          });
        } catch (err) {
          console.warn('Wake Lock failed:', err);
        }
      }

      // Re-acquire on visibility change (e.g., user switches back to tab)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isStarted && !wakeLock) {
          acquireWakeLock();
        }
      });

      /* ==============================================================
         CLOCK
         ============================================================== */
      const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const MONTHS = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];

      function updateClock() {
        const now = new Date();
        let h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;

        $clockHM.textContent   = `${h}:${String(m).padStart(2, '0')}`;
        $clockSec.textContent  = String(s).padStart(2, '0');
        $clockAMPM.textContent = ampm;
        $clockDate.textContent = `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}`;

        // Night-mode check
        const hour = now.getHours();
        const isNight = hour >= NIGHT_START || hour < NIGHT_END;
        document.body.classList.toggle('night-mode', isNight);
        $indNight.classList.toggle('active', isNight);
      }

      updateClock();
      setInterval(updateClock, CLOCK_TICK);

      /* ==============================================================
         SETTINGS PANEL — Triple-tap to open
         ============================================================== */
      let tapCount = 0;
      let tapTimer = null;

      document.addEventListener('click', (e) => {
        // Ignore if overlay is showing or if clicking inside settings
        if (!isStarted) return;
        if ($settings.contains(e.target)) return;

        tapCount++;
        if (tapCount === 1) {
          tapTimer = setTimeout(() => { tapCount = 0; }, 600);
        }
        if (tapCount >= 3) {
          clearTimeout(tapTimer);
          tapCount = 0;
          toggleSettings();
        }
      });

      function toggleSettings() {
        const isOpen = $settings.classList.toggle('open');
        if (isOpen) {
          $inputPL.value = playlist.join(', ');
          $settings.style.pointerEvents = 'auto';
        } else {
          $settings.style.pointerEvents = 'none';
        }
      }

      $btnClose.addEventListener('click', (e) => {
        e.stopPropagation();
        $settings.classList.remove('open');
      });

      $btnApply.addEventListener('click', (e) => {
        e.stopPropagation();
        const raw = $inputPL.value;
        const ids = raw.split(',').map(s => s.trim()).filter(Boolean);
        if (ids.length === 0) return;

        savePlaylist(ids);
        currentIndex = 0;
        if (player && player.loadVideoById) {
          player.loadVideoById({ videoId: ids[0], startSeconds: 0 });
        }
        $settings.classList.remove('open');
      });

      /* ==============================================================
         FULLSCREEN HELPER (double-tap for mobile)
         ============================================================== */
      let dblTimer = null;
      let dblCount = 0;

      document.addEventListener('dblclick', (e) => {
        if (!isStarted) return;
        if ($settings.classList.contains('open')) return;
        e.preventDefault();

        const el = document.documentElement;
        if (!document.fullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
        }
      });

    })();
  </script>

</body>
</html>
